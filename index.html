<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ArogyaMitra – Health Companion</title>
  <meta name="theme-color" content="#e8f4fd">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
/* ===== Glacier palette (edit here) ===== */
:root{
  --ice-50:#f5fbff;--ice-100:#e8f4fd;--ice-200:#d0e8f8;--ice-300:#a6d2ee;
  --ice-500:#4aa0dc;--ice-600:#2a80c4;--ice-700:#1c649e;--ice-900:#0d2f4d;
  --white:#fff;--text:#0f2d47;--muted:#5a7a93;--line:#cfe5f4;
  --ok:#25a6a0;--warn:#e9a53b;--bad:#e0525c;
  --p:var(--ice-600);--pd:var(--ice-700);
  --display:"Bricolage Grotesque","Noto Sans Telugu","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Kannada","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Noto Sans Telugu","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Kannada","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:grid;grid-template-columns:310px 1fr;color:var(--text);font:15.5px/1.55 var(--body);
  background:
    radial-gradient(900px 500px at 105% -10%,#cfe9fb 0,transparent 60%),
    radial-gradient(700px 500px at -10% 110%,#dbeffc 0,transparent 60%),
    linear-gradient(180deg,#fff,var(--ice-50));
  background-attachment:fixed;
}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ice-500);outline-offset:2px}

/* ===== Sidebar: floating frosted pane ===== */
#side{
  margin:14px 0 14px 14px;padding:22px 18px;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;
  background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid #fff;border-radius:26px;
  box-shadow:0 10px 40px rgba(42,128,196,.14),inset 0 0 0 1px var(--line);
}
#side h2{margin:0 0 8px;font:700 23px/1.1 var(--display);color:var(--ice-900);letter-spacing:-.01em}
#side h3{margin:18px 0 0;font:600 14px var(--display);color:var(--muted)}
.primary{
  background:linear-gradient(135deg,#5ab2ea,var(--ice-600));color:#fff;border:0;
  border-radius:14px 14px 14px 4px;padding:12px;font-weight:700;
  box-shadow:0 6px 16px rgba(42,128,196,.3);transition:transform .15s,box-shadow .15s
}
.primary:hover{transform:translateY(-1px);box-shadow:0 9px 20px rgba(42,128,196,.38)}
#history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#history li{display:flex;border-radius:12px;background:var(--ice-50);border:1px solid var(--line)}
#history li.on{border-color:var(--ice-500);background:#fff;box-shadow:inset 4px 0 0 var(--ice-500)}
#history .item{flex:1;text-align:left;background:none;border:0;padding:9px 12px;font-weight:600;color:var(--text)}
#history .item small{display:block;font-weight:400;color:var(--muted);font-size:12px}
#history .del{background:none;border:0;color:var(--muted);padding:0 12px}
#history .del:hover{color:var(--bad)}
#history .empty{color:var(--muted);font-size:13px;border:0;background:none}
.link{background:none;border:0;color:var(--ice-700);text-align:left;padding:0;font-size:13px;text-decoration:underline}
.notice{margin-top:auto;font-size:12px;color:var(--muted);background:var(--ice-100);border-radius:12px;padding:10px 12px}

/* ===== Main ===== */
#main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 28px 6px;font-size:13px;color:var(--muted)}
#menu{display:none;background:none;border:0;font-size:22px;color:var(--ice-900)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.status{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.status i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:7px;box-shadow:0 0 0 3px rgba(37,166,160,.2)}
.head{padding:0 28px 8px;display:grid;gap:12px}

/* Banner: an ice sheet with crystal facets */
.banner{
  position:relative;overflow:hidden;color:var(--ice-900);border-radius:22px;padding:18px 24px;
  background:
    linear-gradient(115deg,rgba(255,255,255,.75) 0 18%,transparent 18% 100%),
    linear-gradient(65deg,transparent 0 55%,rgba(255,255,255,.5) 55% 70%,transparent 70%),
    linear-gradient(135deg,#bfe0f7,#e9f5fd 60%,#fff);
  border:1px solid #fff;box-shadow:0 8px 28px rgba(42,128,196,.16)
}
.banner::after{content:"❄";position:absolute;right:20px;top:-8px;font-size:84px;color:rgba(42,128,196,.14);transform:rotate(14deg);pointer-events:none}
.banner h1{margin:0;font:700 25px/1.15 var(--display);letter-spacing:-.015em}
.banner p{margin:5px 0 0;font-size:14.5px;color:#2d5a7d;max-width:640px}
#searchForm,#form{display:flex;gap:8px}
#searchForm{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:999px;padding:6px}
input{flex:1;min-width:0;padding:11px 18px;border:1.5px solid transparent;border-radius:999px;font:inherit;outline:none;background:var(--ice-50);color:var(--text)}
input::placeholder{color:#86a3b8}
input:focus{border-color:var(--ice-500);background:#fff}
#searchForm button,#form button{background:linear-gradient(135deg,#5ab2ea,var(--ice-600));color:#fff;border:0;border-radius:999px;padding:0 24px;font-weight:700}
#searchForm button:hover,#form button:hover{background:var(--pd)}

/* ===== Messages ===== */
#messages{flex:1;overflow-y:auto;padding:12px max(28px,calc((100% - 1000px)/2));display:flex;flex-direction:column;gap:11px}
.msg{max-width:min(760px,92%);padding:12px 16px;box-shadow:0 2px 10px rgba(42,128,196,.1);animation:pop .2s ease}
.msg small{display:block;margin-top:5px;font-size:11px;opacity:.55}
.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:4px 20px 20px 20px}
.user{align-self:flex-end;background:linear-gradient(135deg,#4aa0dc,var(--ice-700));color:#fff;border-radius:20px 20px 4px 20px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--ice-500);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px)}}

/* ===== Chips ===== */
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:min(900px,100%)}
.chips button{border:1.5px solid var(--ice-300);background:rgba(255,255,255,.9);color:var(--ice-700);padding:7px 16px;border-radius:999px;font-weight:600;transition:background .15s,color .15s,border-color .15s}
.chips button:hover{background:var(--ice-600);border-color:var(--ice-600);color:#fff}

/* ===== Report card (severity shown by top edge) ===== */
.card{width:min(760px,100%);border-radius:6px 22px 22px 22px;border-top:6px solid var(--ok);padding-top:14px}
.card.lvl1{border-top-color:var(--warn)}.card.lvl2,.card.emergency{border-top-color:var(--bad)}
.card h3{margin:0 0 6px;font:700 19px var(--display);color:var(--ice-900)}
.card h4{margin:14px 0 2px;font:600 14px var(--display);color:var(--ice-700)}
.card ul{margin:4px 0;padding-left:20px}.card p{margin:8px 0}
.card .warn{background:#fff4dc;border-radius:10px;padding:7px 11px;margin:6px 0}
.card.emergency{background:#fff5f6}

footer{padding:6px 28px 12px;text-align:center;font-size:12px;color:var(--muted)}
#form{padding:8px max(28px,calc((100% - 1000px)/2));height:64px}

@media(max-width:800px){
  body{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;margin:0;width:290px;border-radius:0 26px 26px 0;z-index:5;transform:translateX(-100%);transition:transform .2s;background:rgba(255,255,255,.95)}
  #side.open{transform:none;box-shadow:0 0 40px rgba(13,47,77,.3)}
  #menu{display:block}
  .head,.top{padding-left:16px;padding-right:16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Language select, read-aloud, mic ===== */
#langSel{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:5px 12px;font:600 13px var(--body);cursor:pointer}
.speak{background:#fff;border:1px solid var(--line);border-radius:50%;width:32px;height:32px;padding:0;font-size:15px;line-height:1}
.speak[aria-pressed="true"]{background:var(--ice-100);border-color:var(--ice-500)}
#form .mic{width:46px;flex:none;padding:0;border-radius:50%;background:#fff;color:var(--ice-700);border:1.5px solid var(--ice-300);display:grid;place-items:center}
#form .mic:hover{background:var(--ice-100);color:var(--ice-700)}
#form .mic.on{background:var(--ice-600);color:#fff;border-color:var(--ice-600);animation:micpulse 1.2s ease-out infinite}
#form .mic.off{opacity:.45}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(74,160,220,.55)}100%{box-shadow:0 0 0 14px rgba(74,160,220,0)}}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:60;background:var(--ice-900);color:#fff;padding:9px 18px;border-radius:999px;font-size:14px;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* ===== Welcome page ===== */
#welcome{position:fixed;inset:0;z-index:40;overflow-y:auto;display:grid;place-items:center;padding:28px 28px 36px;
  background:
    radial-gradient(800px 480px at 88% 8%,#cbe7fa 0,transparent 62%),
    radial-gradient(700px 520px at 6% 96%,#dcefff 0,transparent 60%),
    linear-gradient(180deg,#fff,var(--ice-50))}
#welcome[hidden]{display:none}
body.on-welcome{overflow:hidden}
.w-wrap{width:min(1080px,100%);display:grid;grid-template-columns:1.15fr .85fr;grid-template-areas:"top top" "copy voice" "feats feats" "note note";column-gap:56px;row-gap:34px;align-items:center}
.w-top{grid-area:top;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.w-brand{font:700 20px var(--display);color:var(--ice-900)}
.w-langs{display:flex;gap:6px;flex-wrap:wrap;background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:999px;padding:5px}
.w-langs button{border:0;background:none;color:var(--ice-700);border-radius:999px;padding:7px 15px;font-weight:600}
.w-langs button:hover{background:var(--ice-100)}
.w-langs button[aria-pressed="true"]{background:var(--ice-600);color:#fff}
.w-copy{grid-area:copy}
.w-copy h1{margin:0 0 16px;font:700 clamp(32px,5vw,54px)/1.08 var(--display);letter-spacing:-.025em;color:var(--ice-900)}
.w-sub{margin:0 0 26px;font-size:18px;line-height:1.6;color:#2f5675;max-width:34em}
.w-start{padding:14px 34px;font-size:17px;border-radius:18px 18px 18px 5px}
.w-voice{grid-area:voice;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.orb{position:relative;width:200px;height:200px;border-radius:50%;border:0;color:var(--ice-700);display:grid;place-items:center;
  background:radial-gradient(circle at 32% 26%,#fff 0,#dff0fc 36%,#8ec9f1 76%,#58a8e0 100%);
  box-shadow:inset -14px -18px 34px rgba(28,100,158,.22),0 26px 60px rgba(42,128,196,.32);transition:transform .2s}
.orb:hover{transform:scale(1.03)}
.orb svg{width:66px;height:66px}
.orb::before,.orb::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1.5px solid rgba(74,160,220,.5);animation:ring 3.4s ease-out infinite;pointer-events:none}
.orb::after{animation-delay:1.7s}
.orb.live{background:radial-gradient(circle at 32% 26%,#fff 0,#b9defa 34%,#3f9ae0 80%,#1c649e 100%);color:#fff}
.orb.live::before,.orb.live::after{animation-duration:1.2s;border-color:rgba(28,100,158,.55)}
.orb.off{opacity:.55}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.55);opacity:0}}
.w-hint{margin:14px 0 0;font-weight:600;color:var(--ice-700);max-width:18em}
.w-heard{margin:0;min-height:1.5em;color:var(--muted);font-style:italic}
.w-feats{grid-area:feats;list-style:none;margin:0;padding:22px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.w-feats li{display:flex;flex-direction:column;gap:5px;padding:0 24px;border-left:1px solid var(--line)}
.w-feats li:first-child{padding-left:0;border-left:0}
.w-feats b{font:700 16px var(--display);color:var(--ice-900)}
.w-feats span{color:var(--muted);font-size:14.5px}
.w-note{grid-area:note;margin:0;font-size:13px;color:var(--muted);text-align:center}

@media(max-width:800px){
  .w-wrap{grid-template-columns:1fr;grid-template-areas:"top" "voice" "copy" "feats" "note";row-gap:26px}
  .orb{width:150px;height:150px}.orb svg{width:50px;height:50px}
  .w-copy{text-align:center}.w-sub{margin-inline:auto}
  .w-top{justify-content:center}
  .w-feats{grid-template-columns:1fr;gap:18px}
  .w-feats li,.w-feats li:first-child{padding:0 0 0 14px;border-left:3px solid var(--ice-300)}
  #toast{bottom:112px}
}

/* ===== Polish: Indic scripts and orb spacing ===== */
:lang(te) h1,:lang(hi) h1,:lang(ta) h1,:lang(kn) h1,:lang(te) h2,:lang(hi) h2,:lang(ta) h2,:lang(kn) h2{letter-spacing:0}
:lang(te) .w-copy h1,:lang(ta) .w-copy h1,:lang(kn) .w-copy h1,:lang(hi) .w-copy h1{line-height:1.3}
:lang(te) body,:lang(ta) body,:lang(kn) body{line-height:1.7}
.w-voice{padding-top:22px}
@media(max-width:800px){
  .w-wrap{grid-template-areas:"top" "copy" "voice" "feats" "note"}
  .w-langs{border-radius:22px;justify-content:center}
  .w-langs button{padding:7px 10px;font-size:14px}
  .orb{width:132px;height:132px}.orb svg{width:44px;height:44px}
  .w-voice{padding-top:8px}
}

</style>
</head>
<body class="on-welcome">

  <!-- WELCOME PAGE (first screen) -->
  <section id="welcome" aria-labelledby="wTitle">
    <div class="w-wrap">
      <header class="w-top">
        <span class="w-brand">❄️ ArogyaMitra</span>
        <div class="w-langs" id="wLangs" role="group" data-i18n-aria="w_lang"></div>
      </header>

      <div class="w-copy">
        <h1 id="wTitle" data-i18n="w_title">Know what your body is telling you</h1>
        <p class="w-sub" data-i18n="w_sub"></p>
        <button id="wStart" class="primary w-start" type="button" data-i18n="w_start">Start check-in</button>
      </div>

      <div class="w-voice">
        <button id="wMic" class="orb" type="button" data-i18n-title="mic_title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.09A6 6 0 0 0 18 11z"/></svg>
        </button>
        <p class="w-hint" data-i18n="w_voice"></p>
        <p id="wHeard" class="w-heard" aria-live="polite"></p>
      </div>

      <ul class="w-feats">
        <li><b data-i18n="f1_t"></b><span data-i18n="f1_d"></span></li>
        <li><b data-i18n="f2_t"></b><span data-i18n="f2_d"></span></li>
        <li><b data-i18n="f3_t"></b><span data-i18n="f3_d"></span></li>
      </ul>
      <p class="w-note" data-i18n="note"></p>
    </div>
  </section>

  <!-- LEFT: history sidebar -->
  <aside id="side">
    <h2>❄️ Care Notes</h2>
    <button id="newBtn" class="primary" type="button" data-i18n="new_btn">＋ New Check-In</button>
    <h3 data-i18n="hist_h">Past visits &amp; chats</h3>
    <ul id="history"></ul>
    <button id="clearBtn" class="link" type="button" data-i18n="clear_btn">Clear all history</button>
    <button id="homeBtn" class="link" type="button" data-i18n="home_btn">← Welcome page</button>
    <p class="notice" data-i18n="note"></p>
  </aside>

  <!-- RIGHT: main area -->
  <div id="main">
    <div class="top">
      <button id="menu" type="button" aria-label="Menu">☰</button>
      <div class="tools">
        <select id="langSel" aria-label="Language"></select>
        <button id="speakBtn" type="button" class="speak" aria-pressed="false" data-i18n-title="speak_title">🔇</button>
        <span class="status"><i></i> Online</span>
      </div>
    </div>
    <div class="head">
      <div class="banner"><h1>ArogyaMitra</h1><p data-i18n="banner_p"></p></div>
      <form id="searchForm"><input id="q" data-i18n-ph="search_ph" aria-label="Search"><button type="submit" data-i18n="search_btn">Search</button></form>
    </div>
    <section id="messages" aria-live="polite"></section>
    <form id="form" autocomplete="off">
      <input id="input" data-i18n-ph="input_ph" aria-label="Your message">
      <button id="micBtn" class="mic" type="button" aria-pressed="false" data-i18n-title="mic_title">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.09A6 6 0 0 0 18 11z"/></svg>
      </button>
      <button type="submit" data-i18n="send">Send</button>
    </form>
    <footer data-i18n="note"></footer>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   lang1.js  –  5 languages: English, తెలుగు, हिन्दी, தமிழ், ಕನ್ನಡ
   1) UI text for every language          (LANGS[code].ui)
   2) Spoken-word vocabulary              (LEX)  → translated into the English
      keywords that script1.js already understands
   3) Voice-command phrases               (CMD)
   To add a word: add it to the "|" separated list. To add a language:
   copy one block in LANGS, LEX and CMD and give it a new code.
   ===================================================================== */

const LANGS = {
  en: { name: "English", speech: "en-IN", ui: {
    w_title: "Know what your body is telling you",
    w_sub: "ArogyaMitra turns how you feel into clear, plain-language guidance. Tap a symptom, type it, or just say it out loud.",
    w_start: "Start check-in", w_voice: "Tap the mic and say “start”", w_lang: "Choose your language",
    f1_t: "Tap or type", f1_d: "Pick a symptom or describe it in your own words.",
    f2_t: "Speak in your language", f2_d: "Voice input works in English, Telugu, Hindi, Tamil and Kannada.",
    f3_t: "Private on your device", f3_d: "Your past check-ins are saved only in this browser.",
    note: "Guidance only, not a diagnosis. In an emergency, call your local emergency number or go to the nearest hospital.",
    banner_p: "A friend and companion for healthcare. Symptom guidance with voice and text input.",
    search_ph: "Search a symptom, e.g. cough, acidity…", search_btn: "Search",
    input_ph: "Tell me how you're feeling… e.g. fever for 2 days", send: "Send",
    new_btn: "＋ New Check-In", hist_h: "Past visits & chats", clear_btn: "Clear all history", home_btn: "← Welcome page",
    mic_title: "Speak", speak_title: "Read replies aloud",
    listening: "Listening…", unsupported: "Voice input isn't supported in this browser. Try Chrome or Edge.",
    denied: "Microphone access was blocked. Allow it in your browser settings.", nospeech: "Didn't catch that. Try again.",
    try_start: "Say “start” to begin.", speak_on: "Reading replies aloud", speak_off: "Reading turned off" } },

  te: { name: "తెలుగు", speech: "te-IN", ui: {

};

/* ---------- Translator: spoken/typed non-English text  →  English keywords for script1.js ---------- */
const _split = s => (s || "").split("|").filter(Boolean);
const _ascii = s => s.replace(/[०-९]/g, c => c.charCodeAt(0) - 0x0966).replace(/[౦-౯]/g, c => c.charCodeAt(0) - 0x0C66)
                      .replace(/[௦-௯]/g, c => c.charCodeAt(0) - 0x0BE6).replace(/[೦-೯]/g, c => c.charCodeAt(0) - 0x0CE6);
const _esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

/* does a short spoken phrase contain this command phrase?  (ASCII = whole word, tiny non-ASCII = exact) */
function phraseIn(norm, p) {
  if (/^[\x00-\x7F]+$/.test(p)) return new RegExp("(^|\\s)" + _esc(p) + "(\\s|$)").test(norm);
  return p.length <= 3 ? norm === p : norm.includes(p);
}
function cmdIn(norm, name) { return Object.values(CMD).some(c => _split(c[name]).some(p => phraseIn(norm, p))); }
function normalise(s) { return _ascii(s).toLowerCase().replace(/[.,!?।॥"“”'’]/g, " ").replace(/\s+/g, " ").trim(); }

function translateIn(raw) {
  if (!/[^\x00-\x7F]/.test(raw)) return raw;                       // plain English: leave untouched
  let low = normalise(raw);
  const eq = (w) => low === w || (w.length >= 3 && low.startsWith(w + " "));

  for (const L of Object.values(LEX)) {                              // whole answer = yes / no
    if (_split(L.yes).some(eq)) return "yes";
    if (_split(L.no).some(eq)) return "no";
  }
  for (const L of Object.values(LEX)) {                              // number words → digits
    const map = Object.fromEntries(_split(L.num).map(p => p.split(":")));
    low = low.split(" ").map(w => map[w] || w).join(" ");
  }

  const parts = [];
  const push = x => { if (!parts.includes(x)) parts.push(x); };
  for (const L of Object.values(LEX)) {
    for (const k in L.sym) if (_split(L.sym[k]).some(t => low.includes(t))) push(SYM_EN[k]);
    for (const k in L.em)  if (_split(L.em[k]).some(t => low.includes(t))) push(EM_EN[k]);
    for (const k in L.cond) if (_split(L.cond[k]).some(t => low.includes(t))) push(COND_EN[k]);
  }
  if (!parts.length && low.length <= 30) {                           // short phrase = chat command
    if (cmdIn(low, "new")) return "start over";
    if (cmdIn(low, "end")) return "end";
  }

  let work = low;                                                    // age / duration / severity
  for (const L of Object.values(LEX)) {
    const take = (units, fmt) => { const u = _split(units).map(_esc).join("|"); if (!u) return;
      work = work.replace(new RegExp("(\\d+)\\s*(?:" + u + ")", "g"), (_, n) => { push(fmt(n)); return " "; }); };
    take(L.unit.year, n => n + " years old");
    take(L.unit.week, n => n + " weeks");
    take(L.unit.month, n => n + " months");
    take(L.unit.day, n => n + " days");
    if (_split(L.today).some(t => work.includes(t))) push("today");
    if (_split(L.yday).some(t => work.includes(t))) push("yesterday");
    for (const k in L.sev) if (_split(L.sev[k]).some(t => work.includes(t))) push(k);
    for (const k in L.age) if (_split(L.age[k]).some(t => work.includes(t))) push(k);
  }
  const residual = work.replace(/[^\x00-\x7F]+/g, " ").replace(/\s+/g, " ").trim();   // keep any English / digits said alongside
  const out = (parts.join(" ") + " " + residual).trim();
  return out || raw;
}

/* ---------- Language state + page text ---------- */
let curLang = "en";
try { curLang = localStorage.getItem("frost.lang") || "en"; } catch (e) {}
if (!LANGS[curLang]) curLang = "en";
const T = key => (LANGS[curLang].ui[key] ?? LANGS.en.ui[key] ?? "");

function applyLang(code) {
  if (typeof document === "undefined") return;
  if (!LANGS[code]) code = "en";
  curLang = code;
  try { localStorage.setItem("frost.lang", code); } catch (e) {}
  document.documentElement.lang = code;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = T(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-title]").forEach(el => { const v = T(el.dataset.i18nTitle); el.title = v; el.setAttribute("aria-label", v); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", T(el.dataset.i18nAria)));
  const sel = document.getElementById("langSel"); if (sel) sel.value = code;
  document.querySelectorAll("#wLangs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === code)));
  document.dispatchEvent(new Event("langchange"));
}

if (typeof document !== "undefined") {
  const sel = document.getElementById("langSel"), pills = document.getElementById("wLangs");
  Object.entries(LANGS).forEach(([code, L]) => {
    const o = document.createElement("option"); o.value = code; o.textContent = L.name; sel.appendChild(o);
    const b = document.createElement("button"); b.type = "button"; b.dataset.lang = code; b.lang = code; b.textContent = L.name;
    b.onclick = () => applyLang(code); pills.appendChild(b);
  });
  sel.onchange = () => applyLang(sel.value);
  applyLang(curLang);
}

if (typeof window !== "undefined") {
  window.translateIn = translateIn;
  window.FROST = { LANGS, CMD, T, applyLang, normalise, cmdIn, get lang() { return curLang; } };
}

  });
}
function openSession(s) {                                                  // old chat, read-only
  cur = s; viewing = true; st = fresh(); st.done = true;
  box.innerHTML = ""; s.msgs.forEach(m => draw(m.who, m.html, m.cls, m.t));
  draw("bot", "📂 Saved chat. Tap <b>New Check-In</b> to start again.");
  renderHistory(); $("side").classList.remove("open");
}
function newChat(withWelcome = true) {
  if (cur && cur.msgs.length <= 1) sessions = sessions.filter(s => s !== cur);   // drop empty chats
  st = fresh(); viewing = false;
  cur = { id: Date.now(), title: "New check-in", ts: Date.now(), msgs: [] };
  sessions.unshift(cur); box.innerHTML = ""; renderHistory(); $("side").classList.remove("open");
  if (withWelcome) welcome();
}
function welcome() {
  say("Hi! I'm <b>ArogyaMitra</b> 💙 Tap a symptom, or type or say it – e.g. <i>“fever for 2 days”</i>.", picker);
}

/* ============ 5. UNDERSTANDING TEXT ============ */
function parseDur(t) {
  t = t.replace(/\d+\s*(?:years?|yrs?|months?)\s*old/g, "");              // "5 years old" is age, not duration
  if (/today|few hours|this morning|tonight/.test(t)) return [0, "since today"];
  const m = t.match(/(\d+)\s*(?:to|-|–)?\s*(\d+)?\s*(day|week|month)/);
  if (m) return [+(m[2] || m[1]) * (m[3] === "week" ? 7 : m[3] === "month" ? 30 : 1), m[0]];
  if (/yesterday/.test(t)) return [1, "since yesterday"];
  if (/week/.test(t)) return [7, "a week or more"];
  return null;
}
function parseSev(t, strict) {
  const m = t.match(/(\d{1,2})\s*(?:\/|out of)\s*10/);
  const n = m ? +m[1] : (!strict && (t.match(/^\s*(\d{1,2})\s*$/) || [])[1]);
  if (n >= 1 && n <= 10) return +n <= 3 ? 1 : +n <= 6 ? 2 : 3;
  if (/severe|unbearable|very bad|worst|terrible|intense/.test(t)) return 3;
  if (/moderate|medium/.test(t)) return 2;
  if (/\bmild|slight|little/.test(t)) return 1;
  return null;
}
function parseAge(t) {
  const m = t.match(/(\d{1,3})\s*(?:years?|yrs?)\s*old|(\d{1,3})\s*(?:yo|y\/o)\b|\bage[: ]*(\d{1,3})/);
  if (m) { const a = +(m[1] || m[2] || m[3]); return a < 12 ? "Child" : a >= 60 ? "Senior" : "Adult"; }
  if (/\d+\s*months?\s*old|child|kid|baby|infant|toddler|under 12/.test(t)) return "Child";
  if (/senior|elderly|60\+|grand(father|mother|pa|ma)|older/.test(t)) return "Senior";
  if (/\badult|teen|young/.test(t)) return "Adult";
  return null;
}
function absorb(t) {                                                       // pull every useful detail from a message
  if (st.dur == null) { const d = parseDur(t); if (d) [st.dur, st.durText] = d; }
  if (!st.sev) { const s = parseSev(t, st.step !== "sev"); if (s) st.sev = s; }
  if (!st.age) { const a = parseAge(t); if (a) st.age = a; }
  CONDS.forEach(([k, , rx]) => {
    if (rx.test(t) && !new RegExp("\\b(no|not|without|don'?t have)\\b.{0,15}(?:" + rx.source + ")", "i").test(t)) st.conds.add(k);
  });
}

/* ============ 6. THE BRAIN ============ */
function addSyms(keys) {
  keys.forEach(k => {
    if (st.syms.includes(k)) return;
    st.syms.push(k);
    S[k].q.forEach(q => { if (st.qs.length < 4) st.qs.push(q); });          // at most 4 follow-ups overall
  });
  cur.title = (st.syms.map(k => S[k].n).join(", ") || st.specs.map(s => s[1]).join(", ") || "New check-in").slice(0, 40);
  renderHistory();
}
function pick(k) {                                                         // tapping a symptom starts straight away
  if (viewing) newChat(false);
  if (st.done) newChat(false);
  addMsg("user", S[k].e + " " + S[k].n); clearChips();
  addSyms([k]); begin();
}

async function handle(raw) {
  const shown = raw.trim(); if (!shown) return;                              // what the person said / typed
  const text = ((window.translateIn ? translateIn(shown) : shown).trim()) || shown;   // English keywords for the engine
  if (viewing) newChat(false);
  const t = text.toLowerCase();
  const found = KEYS.filter(k => S[k].rx.test(t));
  const sp = SPEC.filter(s => s[0].test(t));
  if (st.done && (found.length || sp.length) && !/^(start|end)/.test(t)) newChat(false);
  addMsg("user", shown); clearChips(); input.value = "";

  if (/^(start ?over|restart|reset|new( check-?in)?)$/.test(t)) return newChat();
  if (/^(end|end chat|exit|quit|bye|goodbye|stop|thanks?|thank you)$/.test(t)) {
    st.done = true;
    return say("Take care 💙 Chat saved. Rest, drink water, see a doctor if worse. 👋", ["Start over"]);
  }
  if (EMERGENCY.test(t)) return emergency();
  if (st.done) return say("Check-in finished. Tap <b>Start over</b>. 💙", ["Start over"]);

  const newKeys = found.filter(k => !st.syms.includes(k));
  const newSpecs = sp.filter(s => !st.specs.includes(s));

  /* ---- first message: need at least one symptom ---- */
  if (st.step === "start") {
    if (!newKeys.length && !newSpecs.length) {
      if (/^(hi|hello|hey|good (morning|afternoon|evening))\b/.test(t)) return say("Hi 👋 What's troubling you? Tap one or type.", picker);
      st.unknown.push(shown.slice(0, 60));
      return say(`Don't know “${esc(shown.slice(0, 60))}” 🤔 Please see a doctor. Tap a symptom or type another.`, picker);
    }
    newSpecs.forEach(s => st.specs.push(s)); addSyms(newKeys); absorb(t);
    return begin();
  }

  /* ---- later messages: new symptoms can be added at any time ---- */
  let note = "";
  if (newKeys.length || newSpecs.length) {
    newSpecs.forEach(s => st.specs.push(s)); addSyms(newKeys);
    note = `Added ✓ ${[...newKeys.map(k => S[k].n), ...newSpecs.map(s => s[1])].join(", ")}.<br>`;
  }
  absorb(t);

  const isNo = /^(n|no|none|nothing|nope|nah|not)\b/.test(t), isYes = /^(y|yes|yeah|yep|yup|sure|i do|have)\b/.test(t);
  let ok = false;
  switch (st.step) {
    case "dur": ok = st.dur != null; break;
    case "sev": ok = !!st.sev; break;
    case "age": ok = !!st.age; break;
    case "cond": if (isNo || st.conds.size) { st.condsDone = true; ok = true; } break;
    case "q":
      if (isYes || isNo) {
        const q = st.qs.shift();
        if (isYes) { st.yes.push(q[1]); if (q[2]) st.flags.push(q[1]); }
        if (isYes && q[1] === "self-harm") return emergency(true);
        ok = true;
      }
      break;
  }
  proceed(note || (ok || newKeys.length ? "" : "Didn't catch that – tap an option or type. "));
}

/* ============ 7. ASK THE NEXT MISSING THING ============ */
function begin() {
  const names = [...st.syms.map(k => S[k].e + " " + S[k].n), ...st.specs.map(s => s[1])].join(", ");
  proceed(EMPATHY[Math.floor(Math.random() * EMPATHY.length)](names) + "<br><br>");
}
function proceed(prefix = "") {
  if (st.dur == null) { st.step = "dur"; return say(prefix + "⏱️ How long have you had this?", DUR); }
  if (!st.sev) { st.step = "sev"; return say(prefix + "How strong is it?", SEV); }
  if (!st.age) { st.step = "age"; return say(prefix + "🧑 Who is this for?", AGES); }
  if (st.qs.length) { st.step = "q"; return say(prefix + st.qs[0][0], ["Yes", "No"]); }
  if (!st.condsDone && !st.conds.size) {
    st.step = "cond";
    return say(prefix + "Any existing condition? Tap one or choose None.", ["None", ...CONDS.map(c => c[1])]);
  }
  report(prefix);
}

/* ============ 8. RESULT ============ */
function emergency(selfHarm) {
  st.done = true;
  const msg = selfHarm
    ? "I'm glad you told me 💙 You're not alone. Call your local emergency number or someone you trust <b>now</b>."
    : "Call your local emergency number or go to the nearest ER <b>now</b>. Don't wait.";
  say(`<h3>🚨 This could be serious</h3>${msg}`, ["Start over"], "card emergency");
}

function report(prefix = "") {
  st.done = true;
  const d = st.syms.map(k => S[k]);
  const pts = [0, 0, 2, 4][st.sev] + (st.dur >= 3) + (st.dur >= 7) + st.flags.length * 3 + (st.specs.length ? 3 : 0)
    + (st.unknown.length ? 1 : 0) + (st.age !== "Adult" ? 1 : 0) + (st.conds.size ? 1 : 0) + (st.syms.includes("fever") && st.age === "Child" ? 2 : 0);
  let lvl = pts >= 6 ? 2 : pts >= 3 ? 1 : 0;
  if (st.specs.length || st.unknown.length) lvl = Math.max(lvl, 1);
  const L = [
    ["🟢", "Looks mild", "Home care usually works. Recheck in 2–3 days if not better."],
    ["🟡", "Moderate – keep a close watch", "Watch closely. See a doctor if not better in 48 hours."],
    ["🔴", "Please see a doctor", "Warning signs found. See a doctor today."],
  ][lvl];
  const ul = a => "<ul>" + a.map(x => `<li>${x}</li>`).join("") + "</ul>";
  const notes = [
    ...st.flags.map(f => `⚠️ <b>${f}</b> is a warning sign.`),
    ...(st.age === "Child" ? ["👶 No adult medicines. Ask a paediatrician for the dose."] : []),
    ...(st.age === "Senior" ? ["🧓 Seniors worsen faster. See a doctor if it lasts."] : []),
    ...(st.conds.has("preg") ? ["🤰 Ask your doctor before any medicine."] : []),
    ...(st.conds.has("diabetes") ? ["🩸 Infections raise sugar. Monitor it."] : []),
    ...(st.conds.has("asthma") && (st.syms.includes("cough") || st.syms.includes("cold")) ? ["🌬️ Keep your inhaler handy. Watch for wheezing."] : []),
    ...(st.conds.size ? ["Conditions change what's safe. Confirm with your doctor."] : []),
    ...st.specs.map(s => `🩺 <b>${s[1]}</b>: needs a doctor – see ${s[2]}.`),
    ...st.unknown.map(u => `❓ “${esc(u)}” – please see a doctor.`),
  ];
  const causes = [...new Set(d.flatMap(x => x.c.split(", ")))].slice(0, 6);
  const tips = [...new Set(d.flatMap(x => x.t))].slice(0, 8);
  const condText = st.conds.size ? [...st.conds].map(k => CONDS.find(c => c[0] === k)[1]).join(", ") : "none";

  cur.title = (st.syms.map(k => S[k].n).join(", ") || st.specs.map(s => s[1]).join(", ") || "Check-in").slice(0, 40);
  renderHistory();
  say(`${prefix}<h3>${L[0]} ${L[1]}</h3>
    <b>Symptoms:</b> ${d.map(x => x.e + " " + x.n).join(", ") || "—"}${st.yes.length ? " (also: " + st.yes.join(", ") + ")" : ""}<br>
    <b>Severity:</b> ${SEV[st.sev - 1]} · <b>Duration:</b> ${st.durText || DUR[st.dur === 0 ? 0 : st.dur <= 2 ? 1 : st.dur <= 5 ? 2 : 3].toLowerCase()} · <b>Age:</b> ${st.age} · <b>Conditions:</b> ${condText}
    <p><b>${L[2]}</b></p>
    ${notes.length ? "<h4>Important notes</h4>" + notes.map(n => `<div class="warn">${n}</div>`).join("") : ""}
    ${causes.length ? "<h4>Possible causes</h4>" + ul(causes) : ""}
    ${tips.length ? "<h4>Self-care</h4>" + ul(tips) : ""}
    <h4>See a doctor if:</h4>
    ${ul(["Trouble breathing or chest pain", "Fever over 103°F (39.4°C) or 3+ days", "Confusion, fainting or stiff neck", "Severe pain, or blood in vomit, stool, urine", "Dehydration (dry mouth, little urine, dizziness)", "Symptoms getting worse"])}
    ${DISCLAIMER}`, ["Start over", "End chat"], "card lvl" + lvl);
}

/* ============ 9. SEARCH BAR ============ */
function search(q) {
  q = q.trim(); if (!q) return;
  if (viewing) newChat(false);
  addMsg("user", "🔎 " + q); clearChips();
  const t = (window.translateIn ? translateIn(q) : q).toLowerCase();
  const hits = KEYS.filter(k => S[k].rx.test(t) || S[k].n.toLowerCase().includes(t) || S[k].c.toLowerCase().includes(t)).slice(0, 4);
  const sp = SPEC.filter(s => s[0].test(t));
  let h = hits.map(k => `<b>${S[k].e} ${S[k].n}</b><br><i>Causes:</i> ${S[k].c}<br><i>Self-care:</i> ${S[k].t.join("; ")}<br><br>`).join("");
  h += sp.map(s => `<b>🩺 ${s[1]}</b><br>Needs a doctor – see ${s[2]}.<br><br>`).join("");
  if (!h) h = `No info on “${esc(q)}” 🤔 Please see a doctor.<br>`;
  say(h + DISCLAIMER, !st.done && st.step === "start" ? picker : null);
  $("q").value = "";
}

/* ============ 10. START-UP ============ */
$("form").addEventListener("submit", e => { e.preventDefault(); handle(input.value); });
$("searchForm").addEventListener("submit", e => { e.preventDefault(); search($("q").value); });
$("newBtn").onclick = () => newChat();
$("clearBtn").onclick = () => { if (confirm("Delete all saved chats?")) { sessions = []; persist(); newChat(); } };
$("menu").onclick = () => $("side").classList.toggle("open");
newChat();

</script>
<script>
/* =====================================================================
   voice1.js  –  speech input, voice commands, read-aloud, welcome screen
   Needs lang1.js (languages) and script1.js (the chat engine).
   Uses the browser's built-in Web Speech API – best in Chrome / Edge.
   ===================================================================== */
(function () {
  const $ = id => document.getElementById(id);
  const F = window.FROST;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const welcomeEl = $("welcome"), toastEl = $("toast"), micBtn = $("micBtn"), wMic = $("wMic"), heardEl = $("wHeard");

  let rec = null, listening = false, speakOn = false, toastTimer;
  try { speakOn = localStorage.getItem("frost.speak") === "1"; } catch (e) {}

  /* ---------- small helpers ---------- */
  function toast(msg, ms = 2600) {
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastTimer); if (ms) toastTimer = setTimeout(() => toastEl.classList.remove("show"), ms);
  }
  const onWelcome = () => !welcomeEl.hidden;

  function showWelcome() {
    stopListening(); if ("speechSynthesis" in window) speechSynthesis.cancel();
    welcomeEl.hidden = false; document.body.classList.add("on-welcome");
    $("side").classList.remove("open"); welcomeEl.scrollTop = 0; $("wStart").focus({ preventScroll: true });
  }
  function enterChat() {
    stopListening();
    welcomeEl.hidden = true; document.body.classList.remove("on-welcome");
    if (matchMedia("(pointer:fine)").matches) $("input").focus({ preventScroll: true });
  }

  /* ---------- voice commands ---------- */
  function uiCommand(norm) {
    if (norm.length > 34) return null;                                 // long sentences are symptoms, not commands
    for (const name of ["stopRead", "read", "home", "new", "end", "start"]) if (F.cmdIn(norm, name)) return name;
    return null;
  }

  /* ---------- read replies aloud (English voice – replies are written in English) ---------- */
  function setSpeak(on, quiet) {
    speakOn = on; $("speakBtn").textContent = on ? "🔊" : "🔇"; $("speakBtn").setAttribute("aria-pressed", String(on));
    try { localStorage.setItem("frost.speak", on ? "1" : "0"); } catch (e) {}
    if (!on && "speechSynthesis" in window) speechSynthesis.cancel();
    if (!quiet) toast(F.T(on ? "speak_on" : "speak_off"));
  }
  function speak(text) {
    if (!speakOn || onWelcome() || !("speechSynthesis" in window)) return;
    const clean = text.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\uFE0F]/gu, " ").replace(/\s+/g, " ").trim();
    if (!clean) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean); u.lang = "en-IN"; u.rate = 0.95;
    const v = speechSynthesis.getVoices().find(v => /^en[-_]IN/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
    if (v) u.voice = v; speechSynthesis.speak(u);
  }
  new MutationObserver(recs => {                                       // speak each new bot reply (not bulk-loaded history)
    const added = recs.flatMap(r => [...r.addedNodes]).filter(n => n.nodeType === 1 && n.classList.contains("msg") && n.classList.contains("bot") && !n.classList.contains("typing"));
    if (added.length !== 1) return;
    const c = added[0].cloneNode(true); c.querySelectorAll("small").forEach(x => x.remove()); speak(c.textContent);
  }).observe($("messages"), { childList: true });

  /* ---------- listening ---------- */
  function setMicState(on, ctx) {
    micBtn.classList.toggle("on", on && ctx === "chat"); wMic.classList.toggle("live", on && ctx === "welcome");
    micBtn.setAttribute("aria-pressed", String(on && ctx === "chat"));
  }
  function stopListening() { if (rec && listening) { try { rec.stop(); } catch (e) {} } }

  function startListening(ctx) {
    if (!SR) return toast(F.T("unsupported"), 4500);
    if (listening) return stopListening();
    if ("speechSynthesis" in window) speechSynthesis.cancel();         // don't let the bot hear itself
    rec = new SR(); rec.lang = F.LANGS[F.lang].speech; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    let finalText = "", failed = false;
    heardEl.textContent = "";
    rec.onstart = () => { listening = true; setMicState(true, ctx); toast(F.T("listening"), 0); };
    rec.onresult = e => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
      const live = (finalText + interim).trim();
      if (ctx === "chat") $("input").value = live; else heardEl.textContent = live ? "“" + live + "”" : "";
    };
    rec.onerror = e => {
      failed = true;
      if (e.error === "not-allowed" || e.error === "service-not-allowed") toast(F.T("denied"), 5000);
      else if (e.error === "no-speech") toast(F.T("nospeech"));
      else if (e.error !== "aborted") toast(F.T("nospeech"));
    };
    rec.onend = () => {
      listening = false; setMicState(false, ctx);
      const said = finalText.trim();
      if (said) { toastEl.classList.remove("show"); onSpoken(said, ctx); }
      else { if (!failed) toast(F.T("nospeech")); if (ctx === "chat") $("input").value = ""; }
    };
    try { rec.start(); } catch (e) { listening = false; }
  }

  function onSpoken(said, ctx) {
    const norm = F.normalise(said), cmd = uiCommand(norm);
    if (cmd === "read") return setSpeak(true);
    if (cmd === "stopRead") return setSpeak(false);
    if (ctx === "welcome") {
      if (cmd === "start" || cmd === "new") return enterChat();
      return toast(F.T("try_start"), 3500);
    }
    $("input").value = "";
    if (cmd === "home") return showWelcome();
    if (cmd === "new") return handle("start over");
    if (cmd === "end") return handle("end");
    handle(said);                                                      // anything else is a symptom / answer: send it
  }

  /* ---------- wire up the buttons ---------- */
  micBtn.onclick = () => startListening("chat");
  wMic.onclick = () => startListening("welcome");
  $("wStart").onclick = enterChat;
  $("homeBtn").onclick = showWelcome;
  $("speakBtn").onclick = () => setSpeak(!speakOn);
  if (!SR) { micBtn.classList.add("off"); wMic.classList.add("off"); }
  setSpeak(speakOn, true);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && listening) stopListening(); });
  document.addEventListener("langchange", () => { if (listening) stopListening(); });
  if ("speechSynthesis" in window) speechSynthesis.getVoices();

  showWelcome();                                                       // the welcome page is the first thing people see
  $("wStart").blur();
})();

</script>
</body>
</html>
